version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: app_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - app-network

  web:
    build: .
    command: python -u src/app.py
    volumes:
      - ./:/app
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://app:changeme@db:5432/app_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
